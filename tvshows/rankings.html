<!DOCTYPE html>
<html>
<head>
  <title>TV Show Rankings | Nick Site</title>
  <link rel="stylesheet" href="/nick-site/style.css">
</head>

<body>
  <div id="site-header"></div>
  <script src="/nick-site/nav-loader.js"></script>

  <main>
    <div class="page-topline">
      <div>
        <h2>TV Shows</h2>
        <p>Nick and Sarah's database of TV shows, with rankings, tags, and review information.</p>
      </div>

      <p id="last-updated" class="last-updated">Last updated: —</p>
    </div>

    <div class="movie-controls-row">

      <details id="rankings-columns-dropdown" class="filter-dropdown">
        <summary>Display Columns</summary>

        <label class="filter-option select-all-option">
          <input type="checkbox" id="rankings-columns-select-all">
          Select All
        </label>

        <div id="rankings-columns" class="filter-options"></div>
      </details>

      <div class="table-controls">
        <label for="rankings-sort-column">Sort by:</label>
        <select id="rankings-sort-column" class="sort-select"></select>
        <button id="rankings-sort-direction" class="sort-button" type="button">A–Z</button>
      </div>

      <div class="show-control">
        <label for="rankings-show-count">Show:</label>
        <select id="rankings-show-count" class="sort-select">
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="250">250</option>
          <option value="all">All</option>
        </select>
      </div>

      <button id="download-csv" class="download-button" type="button" aria-label="Download CSV">
        <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"></path>
        </svg>
      </button>

      <input
        type="text"
        id="rankings-search"
        placeholder="Search TV shows..."
        class="search-box"
      >

    </div>

    <div id="column-summary" class="column-summary"></div>

    <details id="tv-filters-panel" class="filters-panel">
      <summary class="filters-panel-summary">
        <span class="filters-summary-inner">
          <span>Filters</span>
          <span id="filters-active-indicator" class="filters-indicator">No filters</span>
        </span>
      </summary>

      <div class="filters-panel-actions">
        <button id="apply-movies-filters" class="filter-button" type="button">
          Apply filters
        </button>

        <button id="clear-movies-filters" class="filter-button" type="button">
          Clear all filters
        </button>
      </div>

      <div class="filter-grid">

        <details class="filter-dropdown">
          <summary>Sample</summary>

          <div class="filter-options advanced-filter-options">
            <select id="tv-rating-status" class="sort-select">
              <option value="all" selected>All Options</option>
              <option value="ranked">Only Ranked</option>
              <option value="unranked">Only Unranked</option>
            </select>
          </div>
        </details>

        <details class="filter-dropdown">
          <summary>Watched / Unwatched</summary>

          <label class="filter-option select-all-option">
            <input type="checkbox" id="tv-watched-select-all" checked>
            Select All
          </label>

          <div id="tv-watched-filter" class="filter-options"></div>
        </details>

        <details class="filter-dropdown">
          <summary>Going to re-watch</summary>

          <label class="filter-option select-all-option">
            <input type="checkbox" id="tv-rewatch-select-all" checked>
            Select All
          </label>

          <div id="tv-rewatch-filter" class="filter-options"></div>
        </details>

       <details class="filter-dropdown">
          <summary>Animated</summary>
        
          <label class="filter-option select-all-option">
            <input type="checkbox" id="animated-select-all" checked>
            Select All
          </label>
        
          <div id="animated-filter" class="filter-options"></div>
        </details>
        
        <details class="filter-dropdown">
          <summary>For Kids</summary>
        
          <label class="filter-option select-all-option">
            <input type="checkbox" id="kids-select-all" checked>
            Select All
          </label>
        
          <div id="kids-filter" class="filter-options"></div>
        </details>

        <details class="filter-dropdown">
          <summary>Episode Tracking</summary>

          <label class="filter-option select-all-option">
            <input type="checkbox" id="tv-tracking-select-all" checked>
            Select All
          </label>

          <div id="tv-tracking-filter" class="filter-options"></div>
        </details>

        <details class="filter-dropdown">
          <summary>TV Show Tier</summary>

          <label class="filter-option select-all-option">
            <input type="checkbox" id="tv-show-tier-select-all" checked>
            Select All
          </label>

          <div id="tv-show-tier-filter" class="filter-options"></div>
        </details>

      </div>
    </details>

    <p id="row-count" class="last-updated"></p>

    <div class="table-wrap">
      <table id="rankings-table" class="rankings-table"></table>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
  function showRankingsError(error) {
    console.error(error);

    const table = document.getElementById("rankings-table");

    if (table) {
      table.innerHTML = `
        <tbody>
          <tr>
            <td>
              Could not load TV show rankings. Check the console for details.
            </td>
          </tr>
        </tbody>
      `;
    }
  }

  const tvShowsDisplayColumns = [
    "Tier",
    "Rk",
    "TV Show",
    "Times Seen",
    "Seasons",
    "Episodes",
    "Years",
    "My Rating",
    "Me vs. IMDB",
    "Updated",
    "Plot",
    "Main Character(s)",
    "Side Characters",
    "Emotion",
    "Dialogue (Writing)",
    "Purpose Met",
    "Cast",
    "Music & Sound",
    "Rewatch Value",
    "Episode Average",
    "Notes (Review)"
  ];

  const tvShowsFilters = [
    {
      column: "Watched / Unwatched",
      targetId: "tv-watched-filter",
      selectAllId: "tv-watched-select-all",
      mode: "or"
    },
    {
      column: "Going to re-watch",
      targetId: "tv-rewatch-filter",
      selectAllId: "tv-rewatch-select-all",
      mode: "or"
    },
    {
      column: "Animated",
      targetId: "animated-filter",
      selectAllId: "animated-select-all",
      mode: "or",
      blankLabel: "NO",
      options: ["YES", "MIXED", "NO"]
    },
    {
      column: "Kids Show",
      targetId: "kids-filter",
      selectAllId: "kids-select-all",
      mode: "or",
      blankLabel: "NO",
      options: ["YES", "SORTA", "NO"]
    },
    {
      column: "Tracking Episode-by-Episode Ranks?",
      targetId: "tv-tracking-filter",
      selectAllId: "tv-tracking-select-all",
      mode: "or"
    },
    {
      column: "TV SHOW TIER",
      targetId: "tv-show-tier-filter",
      selectAllId: "tv-show-tier-select-all",
      mode: "or"
    }
  ];

  window.NICK_SITE_INIT = function () {
    try {
      if (typeof Papa === "undefined") {
        throw new Error("PapaParse did not load.");
      }

      if (typeof loadCSV !== "function") {
        throw new Error("loadCSV is not defined. script.js did not load correctly or has a syntax error.");
      }

      loadCSV(
        window.TVSHOWS_CSV_URL,
        "rankings-table",
        "rankings-search",
        tvShowsDisplayColumns,
        "rankings-columns",
        "rankings-sort-column",
        "rankings-sort-direction",
        tvShowsFilters,
        "rankings-show-count",
        "tv-rating-status"
      ).catch(showRankingsError);
    } catch (error) {
      showRankingsError(error);
    }
  };
</script>

<script src="/nick-site/script-loader.js"></script>
</body>
</html>
