<!DOCTYPE html>
<html>
<head>
  <title>TV Show Card | Nick Site</title>
  <link rel="stylesheet" href="/nick-site/style.css">
</head>

<body>
  <div id="site-header"></div>
  <script src="/nick-site/nav-loader.js"></script>

  <main>
    <div class="page-topline">
      <div>
        <h2>TV Show Card</h2>
        <p>TV Show dashboard with categorical ranks, review notes, and episode-by-episode ranks.</p>
      </div>
    </div>

    <div class="tv-card-controls">

            <div class="tv-card-search-row">
        <div class="tv-card-search-left">
          <input
            id="tv-show-card-select"
            class="search-box tv-card-search"
            placeholder="Select a TV show..."
            autocomplete="off"
          >
      
          <datalist id="tv-show-card-options"></datalist>
      
          <div id="tv-show-card-suggestions" class="tv-card-suggestions" hidden></div>
        </div>
      
        <div class="tv-card-tier-scale" aria-label="Tier scale">
          <span class="tv-tier-pill tv-tier-s">S</span>
          <span class="tv-tier-pill tv-tier-a1">A1</span>
          <span class="tv-tier-pill tv-tier-a2">A2</span>
          <span class="tv-tier-pill tv-tier-a3">A3</span>
          <span class="tv-tier-pill tv-tier-b1">B1</span>
          <span class="tv-tier-pill tv-tier-b2">B2</span>
          <span class="tv-tier-pill tv-tier-b3">B3</span>
          <span class="tv-tier-pill tv-tier-c1">C1</span>
          <span class="tv-tier-pill tv-tier-c2">C2</span>
          <span class="tv-tier-pill tv-tier-c3">C3</span>
          <span class="tv-tier-pill tv-tier-d">D</span>
        </div>
      </div>
    </div>

    <p id="tv-show-card-status" class="last-updated">Select a TV show to generate a card.</p>

    <section id="tv-show-card-output" class="tv-show-card-output"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    window.NICK_SITE_INIT = function () {
      try {
        if (typeof Papa === "undefined") {
          throw new Error("PapaParse did not load.");
        }

        if (typeof loadTVShowCard !== "function") {
          throw new Error("loadTVShowCard is not defined. script.js did not load correctly or has a syntax error.");
        }

        loadTVShowCard(
          window.TVSHOWS_CSV_URL,
          window.EPISODES_CSV_URL
        );
      } catch (error) {
        console.error(error);

        const status = document.getElementById("tv-show-card-status");
        const output = document.getElementById("tv-show-card-output");

        if (status) {
          status.textContent = "Could not load TV show card. Check the console for details.";
        }

        if (output) {
          output.innerHTML = `
            <p class="movie-compare-placeholder">
              TV show card failed to load.
            </p>
          `;
        }
      }
    };
  </script>

  <script src="/nick-site/script-loader.js"></script>
</body>
</html>
