<!DOCTYPE html>
<html>
<head>
  <title>Watch History | Nick Site</title>
  <link rel="stylesheet" href="/nick-site/style.css">
</head>

<body>
  <div id="site-header"></div>
  <script src="/nick-site/nav.js?v=10"></script>

  <main>
    <div class="page-topline">
      <div>
        <h2>Watch History</h2>
        <p>A timeline view of Nick and Sarah's watched movies, with date added, last update, ranking, rating, and review notes.</p>
      </div>
    </div>

   <div class="movie-controls-row">
  <button id="history-sort-column" class="filter-button" type="button">
    Sort by: Last Update
  </button>

  <button id="history-sort-direction" class="filter-button" type="button">
    Sort: Latest
  </button>

  <div class="show-control">
    <label for="history-show-count">Show:</label>
    <select id="history-show-count" class="sort-select">
      <option value="25" selected>25</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="250">250</option>
      <option value="all">All</option>
    </select>
  </div>

  <input 
    type="text" 
    id="history-search" 
    placeholder="Search watch history..."
    class="search-box"
  >
</div>

    <p id="history-row-count" class="last-updated"></p>

    <div class="table-wrap">
      <table id="watch-history-table"></table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="/nick-site/script.js?v=10"></script>

  <script>
    loadMovieWatchHistory(window.MOVIES_CSV_URL);
  </script>
</body>
</html>
