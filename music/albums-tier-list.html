<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Albums Tier List | Nick Site</title>
  <link rel="stylesheet" href="/nick-site/style.css">
</head>

<body>
  <div id="site-header"></div>
  <script src="/nick-site/nav-loader.js"></script>

  <main>
    <div class="page-topline">
      <div>
        <h2>Albums Tier List</h2>
        <p>Albums grouped by tier, using the album rankings sheet.</p>
      </div>

      <p id="last-updated" class="last-updated">Last updated: —</p>
    </div>

    <div class="album-tier-list-controls">
      <div class="rankings-search-wrap album-tier-list-search-wrap">
        <input
          id="album-tier-list-search"
          class="search-box rankings-search-input"
          type="text"
          placeholder="Search albums..."
        >

        <button
          id="album-tier-list-search-clear"
          class="rankings-search-clear-button"
          type="button"
          aria-label="Clear search"
          title="Clear search"
        >
          ×
        </button>

        <button id="album-tier-list-search-button" class="rankings-search-button" type="button">
          Search
        </button>
      </div>

      <label class="show-control">
        Minimum Tier
        <select id="album-tier-list-min-tier" class="sort-select">
          <option value="all" selected>All</option>
          <option value="(S)">(S)</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="A3">A3</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="B3">B3</option>
          <option value="C1">C1</option>
          <option value="C2">C2</option>
          <option value="C3">C3</option>
          <option value="D">D</option>
          <option value="NR">NR</option>
        </select>
      </label>
    </div>

    <div id="album-tier-list-summary" class="album-tier-list-summary">
      Loading album tier list...
    </div>

    <section id="album-tier-list-output" class="album-tier-list-output">
      <div class="rankings-loading-cell">Loading album tier list...</div>
    </section>

    <div id="album-detail-modal" class="album-detail-modal" hidden>
  <div id="album-detail-modal-backdrop" class="album-detail-modal-backdrop"></div>

  <div class="album-detail-modal-card" role="dialog" aria-modal="true" aria-labelledby="album-detail-modal-title">
    <button id="album-detail-modal-close" class="album-detail-modal-close" type="button" aria-label="Close album details">
      ×
    </button>

    <h3 id="album-detail-modal-title">Album Title</h3>
    <p id="album-detail-modal-subtitle" class="album-detail-modal-subtitle"></p>
    <p id="album-detail-modal-meta" class="album-detail-modal-meta"></p>

    <div id="album-detail-modal-data" class="album-detail-modal-data"></div>
  </div>
</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    function loadAlbumTierList() {
      const output = document.getElementById("album-tier-list-output");
      const summary = document.getElementById("album-tier-list-summary");
      const searchInput = document.getElementById("album-tier-list-search");
      const searchButton = document.getElementById("album-tier-list-search-button");
      const clearButton = document.getElementById("album-tier-list-search-clear");
      const minTierSelect = document.getElementById("album-tier-list-min-tier");
      const albumModal = document.getElementById("album-detail-modal");
      const albumModalBackdrop = document.getElementById("album-detail-modal-backdrop");
      const albumModalClose = document.getElementById("album-detail-modal-close");
      const albumModalTitle = document.getElementById("album-detail-modal-title");
      const albumModalSubtitle = document.getElementById("album-detail-modal-subtitle");
      const albumModalMeta = document.getElementById("album-detail-modal-meta");
      const albumModalData = document.getElementById("album-detail-modal-data");

      if (!output) return;

      const tierOrder = [
        "(S)",
        "S",
        "A1",
        "A2",
        "A3",
        "B1",
        "B2",
        "B3",
        "C1",
        "C2",
        "C3",
        "D",
        "NR"
      ];

      const tierColors = {
        "(S)": { bg: "#efd1ff", text: "#5a3286" },
        "S": { bg: "#efd1ff", text: "#5a3286" },
        "A1": { bg: "#888ef5", text: "#111111" },
        "A2": { bg: "#5bc0dd", text: "#111111" },
        "A3": { bg: "#bfe1f6", text: "#0a53a8" },
        "B1": { bg: "#d4edbc", text: "#11734b" },
        "B2": { bg: "#ffe5a0", text: "#473821" },
        "B3": { bg: "#f0c885", text: "#000000" },
        "C1": { bg: "#ffc8aa", text: "#753800" },
        "C2": { bg: "#e38451", text: "#000000" },
        "C3": { bg: "#e36351", text: "#000000" },
        "D": { bg: "#ff0000", text: "#000000" },
        "NR": { bg: "#ffcfc9", text: "#b10202" }
      };

      let albumRows = [];

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getText(row, columns) {
        const columnList = Array.isArray(columns) ? columns : [columns];

        for (const column of columnList) {
          const value = String(row[column] ?? "").trim();

          if (value !== "") {
            return value;
          }
        }

        return "";
      }

     function getAlbumTitle(row) {
      return getText(row, "Album Title");
      }
      
      function getAlbumArtist(row) {
        return getText(row, "Artist");
      }
      
      function getAlbumYear(row) {
        return getText(row, "Year");
      }
      
      function getAlbumTier(row) {
        return getText(row, "Tier") || "NR";
      }

      function getRanking(row) {
        return getText(row, ["Ranking", "Rank", "Rk"]);
      }

      function getXRank(row) {
        return getText(row, ["xRank%", "xRank", "XRank%", "%Tile"]);
      }

      function getNumber(row, columns) {
        const rawValue = getText(row, columns);

        if (rawValue === "") return null;

        const cleanedValue = rawValue.replaceAll(",", "").replace("%", "");
        const numberValue = Number(cleanedValue);

        return Number.isFinite(numberValue) ? numberValue : null;
      }

      function getTierSortIndex(tier) {
        const index = tierOrder.indexOf(tier);

        if (index === -1) {
          return tierOrder.length;
        }

        return index;
      }

      function getAlbumSortValue(row) {
        const ranking = getNumber(row, ["Ranking", "Rank", "Rk"]);

        if (ranking !== null) return ranking;

        const xRank = getNumber(row, ["xRank%", "xRank", "XRank%", "%Tile"]);

        if (xRank !== null) return -xRank;

        return Number.POSITIVE_INFINITY;
      }

      function updateLastUpdatedText(rows) {
        if (typeof updateRankingsLastUpdatedText === "function") {
          updateRankingsLastUpdatedText(rows);
        }
      }

      function getVisibleRows() {
        const searchTerm = searchInput
          ? searchInput.value.trim().toLowerCase()
          : "";

        const minTier = minTierSelect
          ? minTierSelect.value
          : "all";

        const minTierIndex = minTier === "all"
          ? tierOrder.length
          : getTierSortIndex(minTier);

        return albumRows.filter(row => {
          const album = getAlbumTitle(row);
          const tier = getAlbumTier(row);

          if (album === "") return false;

          if (minTier !== "all" && getTierSortIndex(tier) > minTierIndex) {
            return false;
          }

          if (searchTerm === "") return true;

          const searchableText = [
              album,
              getAlbumArtist(row),
              getAlbumYear(row),
              tier,
              getRanking(row),
              getXRank(row)
            ]
              .join(" ")
              .toLowerCase();
        });
      }

      function getAlbumModalRows(row) {
          return Object.keys(row)
            .filter(key => {
              if (!key) return false;
              if (key.startsWith("__")) return false;
        
              return String(row[key] ?? "").trim() !== "";
            })
            .map(key => {
              return {
                label: key,
                value: String(row[key] ?? "").trim()
              };
            });
        }
        
    function openAlbumModal(row) {
          if (!albumModal || !albumModalTitle || !albumModalData) return;
        
          const album = getAlbumTitle(row);
          const artist = getAlbumArtist(row);
          const year = getAlbumYear(row);
          const tier = getAlbumTier(row);
          const ranking = getRanking(row);
          const xRank = getXRank(row);
        
          albumModalTitle.textContent = album || "Album Details";
        
          if (albumModalSubtitle) {
            albumModalSubtitle.textContent = [
              artist,
              year
            ].filter(Boolean).join(" • ");
          }
        
          if (albumModalMeta) {
            albumModalMeta.textContent = [
              tier ? `Tier: ${tier}` : "",
              ranking ? `Rank: #${ranking}` : "",
              xRank ? `xRank: ${xRank}` : ""
            ].filter(Boolean).join(" • ");
          }
        
          const detailRows = getAlbumModalRows(row);
        
          albumModalData.innerHTML = detailRows.map(item => {
            return `
              <div class="album-detail-modal-data-row">
                <div class="album-detail-modal-data-label">
                  ${escapeHTML(item.label)}
                </div>
        
                <div class="album-detail-modal-data-value">
                  ${escapeHTML(item.value)}
                </div>
              </div>
            `;
          }).join("");
        
          albumModal.hidden = false;
          document.body.style.overflow = "hidden";
        }
        
        function closeAlbumModal() {
          if (!albumModal) return;
        
          albumModal.hidden = true;
          document.body.style.overflow = "";
        }
              
      function renderTierList() {
        const visibleRows = getVisibleRows();
        const rowsByTier = new Map();

        tierOrder.forEach(tier => {
          rowsByTier.set(tier, []);
        });

        visibleRows.forEach(row => {
          const tier = getAlbumTier(row);

          if (!rowsByTier.has(tier)) {
            rowsByTier.set(tier, []);
          }

          rowsByTier.get(tier).push(row);
        });

        rowsByTier.forEach(rows => {
          rows.sort((a, b) => getAlbumSortValue(a) - getAlbumSortValue(b));
        });

        const totalVisible = visibleRows.length;
        const totalAlbums = albumRows.length;

        if (summary) {
          summary.textContent = `Showing ${totalVisible} of ${totalAlbums} albums.`;
        }

        if (totalVisible === 0) {
          output.innerHTML = `
            <div class="movie-compare-placeholder">
              No albums match the current search or tier filter.
            </div>
          `;
          return;
        }

        let html = "";

        tierOrder.forEach(tier => {
          const rows = rowsByTier.get(tier) || [];

          if (rows.length === 0) return;

          const colours = tierColors[tier] || {
            bg: "#1f1f1f",
            text: "#f5f5f5"
          };

          html += `
            <section class="album-tier-list-row">
              <div
                class="album-tier-list-label"
                style="background:${colours.bg}; color:${colours.text};"
              >
                ${escapeHTML(tier)}
              </div>

              <div class="album-tier-list-cards">
                ${rows.map(row => {
                    const albumIndex = albumRows.indexOf(row);
                    const album = getAlbumTitle(row);
                    const artist = getAlbumArtist(row);
                    const year = getAlbumYear(row);
                    const ranking = getRanking(row);
                    const xRank = getXRank(row);
                  
                    return `
                      <button class="album-tier-list-card" type="button" data-album-index="${escapeHTML(albumIndex)}">
                        <strong class="album-tier-list-title">
                          ${escapeHTML(album)}
                        </strong>
                  
                        ${artist ? `
                          <span class="album-tier-list-artist">
                            ${escapeHTML(artist)}
                          </span>
                        ` : ""}
                  
                        <small class="album-tier-list-meta">
                          ${year ? `${escapeHTML(year)}` : ""}
                          ${year && ranking ? " • " : ""}
                          ${ranking ? `#${escapeHTML(ranking)}` : ""}
                          ${(year || ranking) && xRank ? " • " : ""}
                          ${xRank ? `${escapeHTML(xRank)}` : ""}
                        </small>
                      </button>
                    `;
                  }).join("")}
              </div>

              <div
                class="album-tier-list-count"
                style="background:${colours.bg}; color:${colours.text};"
              >
                ${escapeHTML(rows.length)}
              </div>
            </section>
          `;
        });

        output.innerHTML = html;
      }

      function updateClearButton() {
        if (!clearButton || !searchInput) return;

        clearButton.hidden = searchInput.value.trim() === "";
      }

      function runSearch() {
        updateClearButton();
        renderTierList();
      }

      output.addEventListener("click", function (event) {
          const card = event.target.closest(".album-tier-list-card");
        
          if (!card) return;
        
          const albumIndex = Number(card.dataset.albumIndex);
          const row = albumRows[albumIndex];
        
          if (!row) return;
        
          openAlbumModal(row);
        });
        
        if (albumModalClose) {
          albumModalClose.addEventListener("click", closeAlbumModal);
        }
        
        if (albumModalBackdrop) {
          albumModalBackdrop.addEventListener("click", closeAlbumModal);
        }
        
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeAlbumModal();
          }
        });
      async function init() {
        try {
          if (typeof Papa === "undefined") {
            throw new Error("PapaParse did not load.");
          }

          if (!window.ALBUMS_CSV_URL) {
            throw new Error("window.ALBUMS_CSV_URL is not defined.");
          }

          const text = typeof getCSVText === "function"
            ? await getCSVText(window.ALBUMS_CSV_URL)
            : await fetch(window.ALBUMS_CSV_URL, { cache: "no-store" }).then(response => response.text());

          const parsed = Papa.parse(text.trim(), {
            header: true,
            skipEmptyLines: true
          });

          albumRows = parsed.data.filter(row => {
            return getAlbumTitle(row) !== "";
          });

          updateLastUpdatedText(albumRows);

          renderTierList();
          updateClearButton();
        } catch (error) {
          console.error(error);

          output.innerHTML = `
            <div class="movie-compare-placeholder">
              Could not load album tier list. Check the console for details.
            </div>
          `;

          if (summary) {
            summary.textContent = "Album tier list failed to load.";
          }
        }
      }

      if (searchInput) {
        searchInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            runSearch();
          }

          if (event.key === "Escape") {
            event.preventDefault();
            searchInput.value = "";
            runSearch();
          }
        });

        searchInput.addEventListener("input", updateClearButton);
      }

      if (searchButton) {
        searchButton.addEventListener("click", runSearch);
      }

      if (clearButton) {
        clearButton.addEventListener("click", function () {
          if (searchInput) {
            searchInput.value = "";
            searchInput.focus();
          }

          runSearch();
        });
      }

      if (minTierSelect) {
        minTierSelect.addEventListener("change", renderTierList);
      }

      init();
    }

    window.NICK_SITE_INIT = function () {
      loadAlbumTierList();
    };
  </script>

  <script src="/nick-site/script-loader.js"></script>
</body>
</html>
