<!DOCTYPE html>
<html>
<head>
  <title>Flags Game | Nick Site</title>
  <link rel="stylesheet" href="/nick-site/style.css">
</head>

<body>
  <div id="site-header"></div>
  <script src="/nick-site/nav-loader.js"></script>

  <main>
    <h2>Flags Game</h2>
    <p>Practice flags, countries, capitals, states, provinces, territories, and FIFA associations.</p>

    <section class="flags-game-shell">

      <div id="flagsStartScreen" class="flags-start-screen">
  <h3>What game would you like to play?</h3>

  <div class="flags-start-columns">

    <section class="flags-start-column">
      <h4>Guess the Flag</h4>

      <div class="flags-game-mode-grid">
        <button class="flags-mode-button" type="button" data-game-mode="flag-country">
          Guess Country from Flag
        </button>

        <button class="flags-mode-button" type="button" data-game-mode="flag-us-state">
          Guess U.S. State from Flag
        </button>

        <button class="flags-mode-button" type="button" data-game-mode="flag-canada-province">
          Guess Canadian Province/Territory from Flag
        </button>

        <button class="flags-mode-button" type="button" data-game-mode="flag-fifa">
          Guess FIFA Nation from Flag
        </button>

        <button class="flags-mode-button" type="button" data-game-mode="flag-all">
          Guess All from Flag
        </button>
      </div>
    </section>

    <section class="flags-start-column">
      <h4>Guess the Capital</h4>

      <div class="flags-game-mode-grid">
        <button class="flags-mode-button" type="button" data-game-mode="capital-to-country">
          Guess Country from Capital City
        </button>

        <button class="flags-mode-button" type="button" data-game-mode="country-to-capital">
          Guess Capital City from Country
        </button>
      </div>
    </section>

  </div>
</div>

      <div id="flagsPlayScreen" class="flags-play-screen" hidden>
        <div class="flags-game-controls">
          <span id="flagsCurrentModeLabel" class="flags-current-mode-label"></span>

          <button id="flagsChangeGameButton" type="button">Change Game Mode</button>
          <button id="flagsShuffleButton" type="button">Shuffle</button>
          <button id="flagsResetButton" type="button">Reset</button>
        </div>

        <div class="flags-score-row">
          <span id="flagsScore">Score: 0 / 0</span>
          <span id="flagsStreak">Streak: 0</span>
          <span id="flagsRemaining">Remaining: 0</span>
        </div>

        <div id="flagsDebug" class="flags-debug"></div>

        <div class="flags-card">
          <div id="flagsPromptText" class="flags-prompt-text" hidden></div>

          <div id="flagsImageWrap" class="flags-image-wrap">
            <img id="flagsImage" src="" alt="Flag" referrerpolicy="no-referrer">
          </div>

          <div class="flags-answer-area">
            <input id="flagsAnswerInput" type="text" placeholder="Type your answer..." autocomplete="off">
            <button id="flagsSubmitButton" type="button">Submit</button>
          </div>

          <div class="flags-action-row">
            <button id="flagsHintButton" type="button">Hint</button>
            <button id="flagsRevealButton" type="button">Reveal</button>
            <button id="flagsSkipButton" type="button">Skip</button>
          </div>

          <div id="flagsFeedback" class="flags-feedback"></div>

          <div id="flagsDetails" class="flags-details"></div>
        </div>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    window.NICK_SITE_INIT = function () {
      window.loadFlagsGame(window.FLAGS_CSV_URL);
    };
  </script>

  <script src="/nick-site/script-loader.js"></script>
</body>
</html>
