<!DOCTYPE html>
<html>
<head>
  <title>Movies | Nick Site</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Nick Lacoste's Portfolio</h1>
    <nav> 
      <a href="index.html">Home</a> 
      <a href="music.html">Music</a> 
      <a href="movies.html">Movies</a> 
      <a href="tv.html">TV Shows</a> 
      <a href="geo.html">Geo</a>
      <a href="professional.html">Professional Work</a> 
    </nav>
  </header>

  <main>
    <div class="page-topline">
      <div>
        <h2>Movies</h2>
        <p>Film rankings, watchlist data, runtimes, directors, actors, and ratings.</p>
      </div>

      <p class="last-updated">Last updated: August 17th, 2026</p>
    </div>

    <div class="movie-controls-row">
      
      <div class="table-controls">
        <label for="movies-sort-column">Sort by:</label>
        <select id="movies-sort-column" class="sort-select"></select>
        <button id="movies-sort-direction" class="sort-button" type="button">A–Z</button>
      </div>

      <details class="filter-dropdown">
        <summary>Movie Series</summary>

        <div class="filter-actions">
          <button id="movie-series-mode" class="filter-button" type="button">
            CONTAINS EITHER
          </button>
        </div>

        <label class="filter-option select-all-option">
          <input type="checkbox" id="movie-series-select-all" checked>
          Select All
        </label>

        <div id="movie-series-filter" class="filter-options"></div>
      </details>

      <details id="movies-columns-dropdown" class="filter-dropdown">
        <summary>Display Columns</summary>

        <label class="filter-option select-all-option">
          <input type="checkbox" id="movies-columns-select-all">
          Select All
        </label>

        <div id="movies-columns" class="filter-options"></div>
      </details>
      <details class="filter-dropdown">
        <summary>Animated</summary>
      
        <label class="filter-option select-all-option">
          <input type="checkbox" id="animated-select-all" checked>
          Select All
        </label>
      
        <div id="animated-filter" class="filter-options"></div>
      </details>
      
      <details class="filter-dropdown">
        <summary>Holiday</summary>
      
        <label class="filter-option select-all-option">
          <input type="checkbox" id="holiday-select-all" checked>
          Select All
        </label>
      
        <div id="holiday-filter" class="filter-options"></div>
      </details>
      
      <details class="filter-dropdown">
        <summary>Sports</summary>
      
        <label class="filter-option select-all-option">
          <input type="checkbox" id="sports-select-all" checked>
          Select All
        </label>
      
        <div id="sports-filter" class="filter-options"></div>
      </details>
      <div class="rating-filter-control">
        <label for="movies-rating-status">Rating:</label>
        <select id="movies-rating-status" class="sort-select">
          <option value="all" selected>All Options</option>
          <option value="ranked">Only Ranked</option>
          <option value="unranked">Only Unranked</option>
        </select>
      </div>
      
      <div class="show-control">
        <label for="movies-show-count">Show:</label>
        <select id="movies-show-count" class="sort-select">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
          <option value="all">All</option>
        </select>
      </div>

      <button id="movies-download-csv" class="download-button" type="button">
        <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"></path>
        </svg>
      </button>
      <input 
        type="text" 
        id="movies-search" 
        placeholder="Search movies..."
        class="search-box"
      >
    </div>
    
    <div id="column-summary" class="column-summary" hidden>
        <p><strong>Summary of displayed columns:</strong> <span id="visible-columns-summary"></span></p>
        <p><strong>Not visible:</strong> <span id="hidden-columns-summary"></span></p>
    </div>
 <div id="movies-error" style="display:none; color:#ffb4b4; background:#3a1111; border:1px solid #8a3333; padding:12px; border-radius:8px; margin:12px 0;"></div>   
    <div class="table-wrap">
      <table id="movies-table"></table>
    </div>
  </main>

  <div id="cell-modal" class="cell-modal" hidden>
  <div class="cell-modal-content">
    <button id="cell-modal-close" class="cell-modal-close" type="button">×</button>
    <h3 id="cell-modal-title"></h3>
    <div id="cell-modal-text"></div>
  </div>
</div>
  
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
 <script>
  loadCSV("data/movies.csv", "movies-table", "movies-search", [
    "Tier",
    "Rk",
    "Name",
    "Year",
    "Mins.",
    "h:mm",
    "My Rating",
    "Me vs. IMDB",
    "Watched?",
    "Updated",
    "Tags",
    "Movie Series?",
    "OMDB_Genre",
    "OMDB_Director",
    "OMDB_Actors",
    "OMDB_Plot",
    "Criterion?",
    "Plot",
    "Main Character(s)",
    "Side Characters",
    "Emotion",
    "Dialogue (Writing)",
    "Purpose Met",
    "Cast",
    "Music & Sound",
    "Rewatch Value",
    "Notes (Review)"
  ], "movies-columns", "movies-sort-column", "movies-sort-direction", [
    {
      column: "Movie Series?",
      targetId: "movie-series-filter",
      selectAllId: "movie-series-select-all",
      modeButtonId: "movie-series-mode",
      mode: "or"
    },
    {
      column: "Animated",
      targetId: "animated-filter",
      selectAllId: "animated-select-all",
      mode: "or",
      blankLabel: "NO",
      options: ["YES", "MIXED", "NO"]
    },
    {
      column: "Holiday?",
      targetId: "holiday-filter",
      selectAllId: "holiday-select-all",
      mode: "or",
      blankLabel: "NO",
      options: ["XMAS", "HALLOWEEN", "SORTA", "NO"]
    },
    {
      column: "Sports?",
      targetId: "sports-filter",
      selectAllId: "sports-select-all",
      mode: "or",
      blankLabel: "NO",
      options: ["YES", "SORTA", "NO"]
    }
  ], "movies-show-count", "movies-rating-status")
    .catch(error => {
      const errorBox = document.getElementById("movies-error");
      errorBox.style.display = "block";
      errorBox.textContent = "Table failed to load: " + error.message;
      console.error(error);
    });

  document.getElementById("movies-download-csv").addEventListener("click", () => {
    exportTableToCSV("movies-table", "movies-export.csv");
  });
</script>
</body>
</html>
